<div id="portfolio-options" aria-label="Portfolio layout concepts">
<style>
#portfolio-options {color:#302f2b;font-family:Arial,sans-serif;background:#fff;padding:22px;}
#portfolio-options * {box-sizing:border-box;}
#portfolio-options button {font:inherit;color:inherit;background:none;border:0;padding:12px;cursor:pointer;}
#portfolio-options .choices {display:flex;gap:10px;flex-wrap:wrap;border-bottom:1px solid #ddd8cd;padding-bottom:12px;}
#portfolio-options .choices button[aria-pressed=true] {background:#eeeae1;}
#portfolio-options .screen {position:relative;background:#fff;min-height:530px;padding:24px 16px;}
#portfolio-options header {display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
#portfolio-options .name {font:28px Georgia,serif;}
#portfolio-options .painting {display:block;max-width:100%;width:640px;height:auto;margin:22px auto;}
#portfolio-options .caption {display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap;max-width:720px;margin:auto;}
#portfolio-options .caption p {max-width:360px;line-height:1.6;}
#portfolio-options .content {max-width:660px;margin:30px auto 12px;}
#portfolio-options h2 {font:34px Georgia,serif;font-weight:400;margin:0 0 22px;}
#portfolio-options .project {display:grid;grid-template-columns:1fr 2fr;gap:22px;padding:20px 0;border-top:1px solid #ddd8cd;line-height:1.5;}
#portfolio-options .project strong {font:23px Georgia,serif;font-weight:400;}
#portfolio-options .drawer {position:absolute;left:0;top:0;bottom:0;width:min(420px,100%);background:#fff;padding:28px;overflow:auto;box-shadow:15px 0 40px #302f2b22;z-index:2;}
#portfolio-options .drawer .project {display:block;}
#portfolio-options .drawer .project p {margin-bottom:0;}
#portfolio-options .close {float:right;}
#portfolio-options .note {padding:16px 0 0;border-top:1px solid #ddd8cd;line-height:1.6;}
#portfolio-options .under {display:block;margin:16px auto;text-decoration:underline;text-underline-offset:5px;}
#portfolio-options [hidden] {display:none!important;}
@media(max-width:500px){#portfolio-options{padding:12px}#portfolio-options .screen{padding:16px 0;min-height:420px}#portfolio-options .project{grid-template-columns:1fr;gap:8px}}
</style>

<script>
(function(){
const root=document.getElementById('portfolio-options');
const state={layout:'cover'};
const gallery=root.querySelector('.gallery'),content=root.querySelector('.content'),drawer=root.querySelector('.drawer'),under=root.querySelector('.under');
const work='<h2>Selected work</h2><div class="project"><strong>Trackside ↗</strong><span>A social motorsports app for following live races and making predictions.</span></div><div class="project"><strong>Brawldle ↗</strong><span>A daily puzzle game played by more than 200,000 people. Acquired in 2026.</span></div><div class="project"><strong>Beacon ↗</strong><span>A native macOS client for managing proxies, routing, and connections.</span></div>';
const sections={work,about:'<h2>A little about me</h2><p style="line-height:1.8">I’m Dale, a Computer Science student at USC. I like making things for the internet, from daily puzzle games to native apps.</p><p style="line-height:1.8">Recently, I’ve been building Trackside, a social motorsports app for live races.</p>',contact:'<h2>Say hello</h2><p>hi@daled.ai</p><p>GitHub ↗ &nbsp; LinkedIn ↗</p>'};
function render(){drawer.hidden=true;gallery.hidden=false;content.hidden=state.layout!=='cover';content.innerHTML=work;under.hidden=state.layout!=='cover';root.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.option===state.layout)));root.querySelector('.note').textContent={cover:'01 — The painting is the opening view. Scroll into a normal portfolio below. Projects stay easy to discover; mobile follows the same flow.',drawer:'02 — Select About or Work to open a reading panel over the painting. The artwork keeps its size behind the panel, but is partly obscured while reading. Mobile uses the full panel width.',pages:'03 — Select About or Work to switch to a dedicated reading page. Home stays focused on the painting; long content gets the whole page. Select Dale Dai to return.'}[state.layout];}
root.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{state.layout=b.dataset.option;render()});
root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const html=sections[b.dataset.action];if(state.layout==='drawer'){drawer.hidden=false;root.querySelector('.drawer-content').innerHTML=html;}else{content.innerHTML=html;content.hidden=false;if(state.layout==='pages'){gallery.hidden=true;}else{content.scrollIntoView({behavior:'smooth',block:'start'});}}});
root.querySelector('.close').onclick=()=>drawer.hidden=true;
root.querySelector('.name').innerHTML='<button aria-label="Return home">Dale Dai</button>';
root.querySelector('.name button').onclick=render;
root.addEventListener('keydown',e=>{if(e.key==='Escape')drawer.hidden=true;});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(state,'layout',{label:'Layout',options:[{label:'Gallery + scroll',value:'cover'},{label:'Reading drawer',value:'drawer'},{label:'Separate pages',value:'pages'}]});}
})();
</script>
